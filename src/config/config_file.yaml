##################### Storage #####################
dataset_name : "image"
folder_image : "./storage/dataset/archive/Images"
file_caption : "./storage/dataset/captions/captions.txt"
folder_train_log : "./storage/log"
folder_test_log : "./storage/log"
folder_model : "./storage/model"

##################### Architecture #####################
load_model_trained : False  # 设置为False重新训练，True跳过训练

##################### Hyper Params #####################
lr : 0.01  # 进一步降低学习率，避免陷入局部最优点（从0.003降到0.001）
wd : 0.0001  # 降低权重衰减，减少过度正则化
batch_size : 32  # 论文配置：批次大小128（如果内存不足可以降低）
epoches : 200  # 至少100轮训练，每5轮保存一次checkpoint
early_stop_patience : 10  # 早停机制：验证损失连续10个epoch不改善则停止训练（设为0禁用早停）