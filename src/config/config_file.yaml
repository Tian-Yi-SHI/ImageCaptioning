##################### Storage #####################
dataset_name : "image"
folder_image : "./storage/dataset/archive/Images"
file_caption : "./storage/dataset/captions/captions.txt"
folder_train_log : "./storage/log"
folder_test_log : "./storage/log"
folder_model : "./storage/model"

##################### Architecture #####################
load_model_trained : False  # 设置为False重新训练，True跳过训练

##################### Hyper Params #####################
lr : 0.003  # 降低到0.003，更稳定的训练
wd : 0.01
batch_size : 32  # 16G内存，使用32批次大小以避免内存溢出
epoches : 100  # 至少100轮训练，每5轮保存一次checkpoint